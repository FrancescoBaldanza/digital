<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f22"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F58A3C"/>
      <stop offset="100%" stop-color="#FFB366"/>
    </linearGradient>

    <!-- Gate Body Gradient -->
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F58A3C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3574F0" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#393b40" stroke-width="2.5"/>

  <!-- Circuit Grid Accent Lines (Subtle) -->
  <path d="M28 20v88 M52 20v88 M76 20v88 M100 20v88" stroke="#2b2d30" stroke-width="1" stroke-dasharray="2 6"/>
  <path d="M20 28h88 M20 52h88 M20 76h88 M20 100h88" stroke="#2b2d30" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- Top Input Circuit Path -->
  <path d="M18 42h18" stroke="#F58A3C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="18" cy="42" r="3.5" fill="#1e1f22" stroke="#F58A3C" stroke-width="2.5"/>

  <!-- Bottom Input Circuit Path -->
  <path d="M18 86h18" stroke="#F58A3C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="18" cy="86" r="3.5" fill="#1e1f22" stroke="#F58A3C" stroke-width="2.5"/>

  <!-- Logic Gate Outline (D-shape logic gate with distinct modern styling) -->
  <path d="M36 32h28c20 0 34 14 34 32s-14 32-34 32H36V32z" 
        fill="url(#gateGrad)" 
        stroke="url(#traceGrad)" 
        stroke-width="4.5" 
        stroke-linejoin="round"/>

  <!-- Gate Internal Circuit Core -->
  <path d="M48 46h16c11 0 18 8 18 18s-7 18-18 18H48" 
        fill="none" 
        stroke="#F58A3C" 
        stroke-width="2.5" 
        stroke-opacity="0.4"
        stroke-dasharray="3 3"/>

  <!-- Center Inversion / Node Bubble -->
  <circle cx="98" cy="64" r="5" fill="#1e1f22" stroke="#F58A3C" stroke-width="3" filter="url(#glow)"/>

  <!-- Output Wire -->
  <path d="M103 64h15" stroke="#F58A3C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="118" cy="64" r="3.5" fill="#1e1f22" stroke="#F58A3C" stroke-width="2.5"/>

  <!-- Clock / Pulse Indicator Icon (Center Core) -->
  <path d="M52 64h8l5-8 6 16 5-8h8" fill="none" stroke="#59A869" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
