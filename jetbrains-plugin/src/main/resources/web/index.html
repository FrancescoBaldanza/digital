<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital - Verilog Simulator</title>
  <script defer src="./main.js"></script>
  <style>
    :root {
      --bg-color: #1e1f22;
      --toolbar-bg: #2b2d30;
      --border-color: #393b40;
      --border-hover: #4e5157;
      --border-focus: #3574f0;
      --text-color: #dfe1e5;
      --text-secondary: #bcbec4;
      --text-muted: #868a98;
      --accent-color: #3574f0;
      --accent-hover: #4682f7;
      --orange-accent: #f58a3c;
      --run-green: #59a869;
      --run-green-glow: rgba(89, 168, 105, 0.4);
      --run-green-bg: rgba(89, 168, 105, 0.16);
      --warn-color: #e5a84b;
      --error-bg: #3c1f1f;
      --error-border: #6b2b2b;
      --error-text: #f75454;
      --selection-bg: #2e436e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Sans", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* CIRCUIT VISUALIZER (Full viewport preview) */
    #circuit-column {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background-color: var(--bg-color);
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background-color: var(--toolbar-bg);
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      flex-wrap: wrap;
      user-select: none;
      z-index: 100;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 26px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text-color);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
      color: #ffffff;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-icon-only {
      width: 26px;
      padding: 0;
    }

    /* Compile Button (JetBrains Academic Hammer matching request) */
    #btn-compile {
      position: relative;
      color: var(--text-color);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    #btn-compile:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
      color: #ffffff;
    }

    #btn-compile.dirty {
      background: rgba(245, 138, 60, 0.12);
      border-color: rgba(245, 138, 60, 0.45);
      color: #ffffff;
    }

    #btn-compile.dirty:hover {
      background: rgba(245, 138, 60, 0.22);
      border-color: var(--orange-accent);
    }

    .compile-dirty-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--orange-accent);
      margin-left: 2px;
      display: inline-block;
    }

    #btn-compile.compiling {
      pointer-events: none;
      opacity: 0.85;
      border-color: var(--warn-color);
    }

    #btn-compile.compiling .compile-icon {
      animation: pulse-hammer 0.7s ease-in-out infinite;
    }

    @keyframes pulse-hammer {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; color: var(--orange-accent); }
    }

    /* Unified Run / Pause toggle button */
    #btn-run-pause {
      min-width: 72px;
      border-color: rgba(89, 168, 105, 0.35);
      background: rgba(89, 168, 105, 0.06);
      color: var(--text-color);
    }

    #btn-run-pause:hover {
      border-color: var(--run-green);
      background: rgba(89, 168, 105, 0.14);
      color: #ffffff;
    }

    #btn-run-pause.is-running {
      background: var(--run-green-bg);
      border-color: var(--run-green);
      color: #8be09b;
      box-shadow: 0 0 8px var(--run-green-glow);
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .jb-icon {
      display: block;
      flex-shrink: 0;
    }

    .separator {
      width: 1px;
      height: 16px;
      background-color: var(--border-color);
      margin: 0 2px;
    }

    /* Toolbar Checkbox */
    .toolbar-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 11px;
      color: var(--text-secondary);
      user-select: none;
      padding: 0 4px;
      height: 26px;
      border-radius: 4px;
      transition: color 0.15s ease;
    }

    .toolbar-checkbox:hover {
      color: var(--text-color);
    }

    .toolbar-checkbox input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .checkbox-custom {
      width: 14px;
      height: 14px;
      border: 1px solid var(--border-hover);
      border-radius: 3px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .toolbar-checkbox input:checked + .checkbox-custom {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .check-icon {
      display: none;
    }

    .toolbar-checkbox input:checked + .checkbox-custom .check-icon {
      display: block;
    }

    /* Status badge pill */
    #status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      margin-left: auto;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-ready { background-color: #57965c; }
    .dot-running { background-color: #59a869; box-shadow: 0 0 6px rgba(89, 168, 105, 0.8); }
    .dot-paused { background-color: var(--warn-color); }
    .dot-loading { background-color: var(--orange-accent); animation: pulse 1s infinite; }
    .dot-error { background-color: var(--error-text); }

    .status-ready { color: #8bb88e; }
    .status-running { color: #8be09b; }
    .status-paused { color: #e5c07b; }
    .status-loading { color: var(--orange-accent); }
    .status-error { color: #f75454; }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Error Banner */
    #error-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--error-bg);
      border-bottom: 1px solid var(--error-border);
      color: var(--error-text);
      font-size: 11.5px;
      z-index: 50;
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    }

    .error-icon {
      flex-shrink: 0;
      color: var(--error-text);
    }

    .error-msg {
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-close {
      font-size: 14px;
      color: var(--error-text);
      opacity: 0.8;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0 4px;
    }

    .error-close:hover {
      opacity: 1;
    }

    /* Paper & Canvas */
    #paper-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #18191b;
    }

    #paper {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Empty state */
    #empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      text-align: center;
    }

    .empty-icon {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .empty-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .empty-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- PREVIEW ONLY: Circuit Visualizer & Toolbar -->
  <main id="circuit-column">
    <div id="toolbar">
      <!-- Prominent Compile action (Hammer icon matching JetBrains build) -->
      <button id="btn-compile" class="btn" title="Compile Verilog source (Cmd/Ctrl+Enter)">
        <span class="btn-icon compile-icon">
          <svg class="jb-icon icon-hammer" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3.5 1C3.63261 1 3.75975 1.05272 3.85352 1.14648L4.70703 2H5.29297L6.14648 1.14648L6.22266 1.08398C6.30419 1.02963 6.40056 1 6.5 1H10.5C13.3162 1 15 3.2657 15 5.5C15 5.67329 14.9101 5.83468 14.7627 5.92578C14.6153 6.01669 14.4312 6.02471 14.2764 5.94727L12.3818 5H10.707L10 5.70703V14.5C10 14.7761 9.77614 15 9.5 15H6.5C6.22386 15 6 14.7761 6 14.5V5.70703L5.29297 5H4.70703L3.85352 5.85352C3.75975 5.94728 3.63261 6 3.5 6H1.5C1.22386 6 1 5.77614 1 5.5V1.5C1 1.22386 1.22386 1 1.5 1H3.5ZM7 14H9V6H7V14ZM2 5H3.29297L4.14648 4.14648L4.22266 4.08398C4.30419 4.02963 4.40056 4 4.5 4H5.5C5.63261 4 5.75975 4.05272 5.85352 4.14648L6.70703 5H9.29297L10.1465 4.14648L10.2227 4.08398C10.3042 4.02963 10.4006 4 10.5 4H12.5C12.5776 4 12.6542 4.01802 12.7236 4.05273L13.8936 4.6377C13.5415 3.21018 12.324 2 10.5 2H6.70703L5.85352 2.85352C5.75975 2.94728 5.63261 3 5.5 3H4.5C4.36739 3 4.24025 2.94728 4.14648 2.85352L3.29297 2H2V5Z"/>
          </svg>
        </span>
        <span class="btn-label">Compile</span>
        <span id="btn-compile-dirty-dot" class="compile-dirty-dot" style="display: none;" title="Uncompiled changes"></span>
      </button>

      <!-- Unified Run / Pause toggle -->
      <button id="btn-run-pause" class="btn" title="Start simulation (Space)">
        <span class="btn-icon">
          <svg class="jb-icon icon-play" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#59a869" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5,3 13,8 5,13" fill="#59a869" fill-opacity="0.2" stroke="#59a869" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="btn-label">Run</span>
      </button>

      <!-- Reset action -->
      <button id="btn-reset" class="btn" title="Restart / Reset simulation state">
        <span class="btn-icon">
          <svg class="jb-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 8 A5.5 5.5 0 1 1 11.8 4.1 L14 4"/>
            <polyline points="14 1.5 14 4.5 11 4.5"/>
          </svg>
        </span>
        <span class="btn-label">Reset</span>
      </button>

      <div class="separator"></div>

      <!-- Zoom & View controls -->
      <button id="btn-zoom-in" class="btn btn-icon-only" title="Zoom in (+)">
        <svg class="jb-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="8" y1="3" x2="8" y2="13"/>
          <line x1="3" y1="8" x2="13" y2="8"/>
        </svg>
      </button>

      <button id="btn-zoom-out" class="btn btn-icon-only" title="Zoom out (-)">
        <svg class="jb-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="3" y1="8" x2="13" y2="8"/>
        </svg>
      </button>

      <button id="btn-fit" class="btn btn-icon-only" title="Fit circuit to view">
        <svg class="jb-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 5.5V3a.5.5 0 0 1 .5-.5h2.5M10.5 2.5H13a.5.5 0 0 1 .5.5v2.5M13.5 10.5V13a.5.5 0 0 1-.5.5h-2.5M5.5 13.5H3a.5.5 0 0 1-.5-.5v-2.5"/>
        </svg>
      </button>

      <div class="separator"></div>

      <!-- Layout Mode Checkbox -->
      <label class="toolbar-checkbox" title="Fix component positions (prevent manual drag-repositioning)">
        <input type="checkbox" id="chk-fixed" checked>
        <span class="checkbox-custom">
          <svg class="check-icon" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="2.5,6 4.5,8.5 9.5,3.5"/>
          </svg>
        </span>
        <span>Fixed Layout</span>
      </label>

      <!-- Status badge pill -->
      <div id="status-badge" class="status-ready">
        <span id="status-dot" class="status-dot dot-ready"></span>
        <span id="status-text">Ready</span>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="error-banner">
      <svg class="error-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <line x1="8" y1="5" x2="8" y2="9"/>
        <circle cx="8" cy="11.5" r="0.5" fill="currentColor"/>
      </svg>
      <span id="error-text" class="error-msg"></span>
      <button id="btn-close-error" class="btn btn-icon-only error-close" title="Dismiss error">&times;</button>
    </div>

    <!-- Circuit Paper Canvas -->
    <div id="paper-container">
      <div id="paper"></div>
      <div id="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <path d="M14 9h4M14 15h4"/>
        </svg>
        <div class="empty-title">No Circuit Loaded</div>
        <div class="empty-subtitle">Write Verilog code in the editor and click Compile to visualize the live circuit</div>
      </div>
    </div>
  </main>
</div>

<script>
  let circuit = null;
  let paper = null;
  let currentCircuitJson = null;
  let zoomLevel = 1.0;

  const PLAY_SVG = `<svg class="jb-icon icon-play" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#59a869" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="5,3 13,8 5,13" fill="#59a869" fill-opacity="0.2" stroke="#59a869" stroke-width="1.5"/>
  </svg>`;

  const PAUSE_SVG = `<svg class="jb-icon icon-pause" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="3.5" width="2.2" height="9" rx="0.75" fill="currentColor" fill-opacity="0.2"/>
    <rect x="9.3" y="3.5" width="2.2" height="9" rx="0.75" fill="currentColor" fill-opacity="0.2"/>
  </svg>`;

  function decodeUtf8(base64) {
    try {
      const binString = atob(base64);
      const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
      return new TextDecoder().decode(bytes);
    } catch(e) {
      console.error("UTF8 decode error:", e);
      return atob(base64);
    }
  }

  function setStatus(text, type) {
    const badgeEl = document.getElementById('status-badge');
    const textEl = document.getElementById('status-text');
    const dotEl = document.getElementById('status-dot');

    if (!badgeEl || !textEl || !dotEl) return;
    textEl.textContent = text;

    dotEl.className = 'status-dot';
    badgeEl.className = '';

    switch (type) {
      case 'error':
        dotEl.classList.add('dot-error');
        badgeEl.classList.add('status-error');
        break;
      case 'loading':
        dotEl.classList.add('dot-loading');
        badgeEl.classList.add('status-loading');
        break;
      case 'running':
        dotEl.classList.add('dot-running');
        badgeEl.classList.add('status-running');
        break;
      case 'paused':
        dotEl.classList.add('dot-paused');
        badgeEl.classList.add('status-paused');
        break;
      case 'ready':
      default:
        dotEl.classList.add('dot-ready');
        badgeEl.classList.add('status-ready');
        break;
    }
  }

  function hideError() {
    const banner = document.getElementById('error-banner');
    if (banner) {
      banner.style.display = 'none';
      document.getElementById('error-text').textContent = '';
    }
  }

  function showError(msg) {
    const banner = document.getElementById('error-banner');
    const errorText = document.getElementById('error-text');
    if (banner && errorText) {
      errorText.textContent = msg;
      banner.style.display = 'flex';
      setStatus('Error', 'error');
    }
  }

  function destroyCurrentCircuit() {
    if (circuit) {
      try {
        circuit.stop();
        circuit.trigger('shutdown');
      } catch(_) {}
      circuit = null;
    }
    const container = document.getElementById('paper');
    if (container) container.innerHTML = '';
    paper = null;
  }

  function updatePlayState() {
    const btn = document.getElementById('btn-run-pause');
    if (!btn) return;
    const iconSpan = btn.querySelector('.btn-icon');
    const labelSpan = btn.querySelector('.btn-label');

    if (circuit && circuit.running) {
      btn.classList.add('is-running');
      btn.setAttribute('title', 'Pause simulation (Space)');
      if (iconSpan) iconSpan.innerHTML = PAUSE_SVG;
      if (labelSpan) labelSpan.textContent = 'Pause';
      setStatus('Running', 'running');
    } else {
      btn.classList.remove('is-running');
      btn.setAttribute('title', 'Start simulation (Space)');
      if (iconSpan) iconSpan.innerHTML = PLAY_SVG;
      if (labelSpan) labelSpan.textContent = 'Run';
      if (circuit) {
        setStatus('Paused', 'paused');
      } else {
        setStatus('Ready', 'ready');
      }
    }
  }

  function toggleSimulation() {
    if (!circuit) return;
    if (circuit.running) {
      circuit.stop();
    } else {
      circuit.start();
    }
    updatePlayState();
  }

  // Compiler State and Dirty tracking
  window.compilerState = {
    isDirty: false
  };

  function setDirty(isDirty) {
    window.compilerState.isDirty = Boolean(isDirty);
    const compileBtn = document.getElementById('btn-compile');
    const dirtyDot = document.getElementById('btn-compile-dirty-dot');

    if (compileBtn) {
      compileBtn.classList.toggle('dirty', Boolean(isDirty));
    }
    if (dirtyDot) {
      dirtyDot.style.display = isDirty ? 'inline-block' : 'none';
    }
  }
  window.setDirty = setDirty;

  function triggerCompile() {
    setDirty(false);
    const compileBtn = document.getElementById('btn-compile');
    if (compileBtn) compileBtn.classList.add('compiling');
    setStatus('Synthesizing...', 'loading');
    hideError();

    // Trigger JetBrains native compilation query
    if (typeof window.triggerCompileNative === 'function') {
      window.triggerCompileNative();
      setTimeout(() => {
        if (compileBtn) compileBtn.classList.remove('compiling');
      }, 300);
    }
  }

  function resetCircuit() {
    if (circuit && typeof circuit.reset === 'function') {
      try {
        circuit.reset();
        updatePlayState();
        return;
      } catch (e) {
        console.warn('circuit.reset() exception:', e);
      }
    }
    if (currentCircuitJson) {
      loadCircuit(currentCircuitJson);
    }
  }

  function zoomIn() {
    if (paper) {
      const currentScale = paper.scale();
      const sx = currentScale.sx || zoomLevel;
      const newZoom = Math.min(sx * 1.25, 5.0);
      const container = document.getElementById('paper-container');
      const cx = (container ? container.clientWidth : window.innerWidth) / 2;
      const cy = (container ? container.clientHeight : window.innerHeight) / 2;
      const origin = paper.translate();
      const newTx = cx - (cx - origin.tx) * (newZoom / sx);
      const newTy = cy - (cy - origin.ty) * (newZoom / sx);
      zoomLevel = newZoom;
      paper.scale(zoomLevel, zoomLevel);
      paper.translate(newTx, newTy);
    }
  }

  function zoomOut() {
    if (paper) {
      const currentScale = paper.scale();
      const sx = currentScale.sx || zoomLevel;
      const newZoom = Math.max(sx / 1.25, 0.15);
      const container = document.getElementById('paper-container');
      const cx = (container ? container.clientWidth : window.innerWidth) / 2;
      const cy = (container ? container.clientHeight : window.innerHeight) / 2;
      const origin = paper.translate();
      const newTx = cx - (cx - origin.tx) * (newZoom / sx);
      const newTy = cy - (cy - origin.ty) * (newZoom / sx);
      zoomLevel = newZoom;
      paper.scale(zoomLevel, zoomLevel);
      paper.translate(newTx, newTy);
    }
  }

  function fitView() {
    if (paper && circuit) {
      zoomLevel = 1.0;
      paper.scale(1.0, 1.0);
      try {
        paper.fitToContent({ padding: 30, allowNewOrigin: 'any' });
        const scale = paper.scale();
        zoomLevel = scale.sx || 1.0;
      } catch(_) {}
    }
  }

  function loadCircuit(json) {
    destroyCurrentCircuit();
    hideError();
    currentCircuitJson = json;

    const emptyState = document.getElementById('empty-state');
    if (emptyState) emptyState.style.display = 'none';

    const djs = window.digital || window.digitaljs;
    const hasJquery = typeof $ !== 'undefined';
    if (!djs || !djs.Circuit || !hasJquery) {
      console.warn('Digital runtime is loading...');
      setStatus('Loading runtime...', 'loading');
      setTimeout(() => loadCircuit(json), 150);
      return;
    }

    try {
      circuit = new djs.Circuit(json, { layoutEngine: "elkjs" });
      const paperContainer = hasJquery ? $('#paper') : document.getElementById('paper');
      paper = circuit.displayOn(paperContainer);

      const chkFixed = document.getElementById('chk-fixed');
      const isFixed = chkFixed ? chkFixed.checked : true;
      if (paper && paper.fixed) {
        paper.fixed(isFixed);
      }

      circuit.on('changeRunning', () => {
        updatePlayState();
      });

      circuit.start();
      updatePlayState();
    } catch (e) {
      console.error('Error instantiating Digital Circuit:', e);
      showError('Render Error: ' + e.message);
    }
  }

  // Public bridge methods callable from Kotlin / JCEF
  window.loadCircuitFromBase64 = function(b64) {
    const compileBtn = document.getElementById('btn-compile');
    if (compileBtn) compileBtn.classList.remove('compiling');
    setDirty(false);
    try {
      const jsonStr = decodeUtf8(b64);
      const data = JSON.parse(jsonStr);
      loadCircuit(data);
    } catch (e) {
      console.error('Failed to parse circuit payload:', e);
      showError('Failed to parse circuit: ' + e.message);
    }
  };

  window.showErrorFromBase64 = function(b64) {
    const compileBtn = document.getElementById('btn-compile');
    if (compileBtn) compileBtn.classList.remove('compiling');
    try {
      const msg = decodeUtf8(b64);
      showError(msg);
    } catch (e) {
      showError(b64);
    }
  };

  window.setSynthesizing = function() {
    setDirty(false);
    setStatus('Synthesizing...', 'loading');
    hideError();
  };

  // Event Listeners setup
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-compile').addEventListener('click', triggerCompile);
    document.getElementById('btn-run-pause').addEventListener('click', toggleSimulation);
    document.getElementById('btn-reset').addEventListener('click', resetCircuit);
    document.getElementById('btn-zoom-in').addEventListener('click', zoomIn);
    document.getElementById('btn-zoom-out').addEventListener('click', zoomOut);
    document.getElementById('btn-fit').addEventListener('click', fitView);
    document.getElementById('btn-close-error').addEventListener('click', hideError);

    document.getElementById('chk-fixed').addEventListener('change', (e) => {
      if (paper && paper.fixed) {
        paper.fixed(e.target.checked);
      }
    });

    // Global keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        triggerCompile();
      } else if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        toggleSimulation();
      } else if (e.key === '+' || e.key === '=') {
        if (!e.metaKey && !e.ctrlKey) {
          zoomIn();
        }
      } else if (e.key === '-' || e.key === '_') {
        if (!e.metaKey && !e.ctrlKey) {
          zoomOut();
        }
      }
    });

    setStatus('Ready', 'ready');
  });
</script>

</body>
</html>
